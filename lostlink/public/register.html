<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register an item - LostLink</title><link rel="stylesheet" href="/style.css"></head><body>
<main><h1>Register an item</h1>
<form id="f" class="card" autocomplete="off">
<h2>The item</h2>
<label for="item_name">Item name</label><input id="item_name" required maxlength="80" placeholder="Blue water bottle">
<div class="grid2"><div><label for="category">Type</label><select id="category"><option>Bag</option><option>Water bottle</option><option>Calculator</option><option>Umbrella</option><option>Gadget</option><option>Clothing</option><option>Books</option><option>Other</option></select></div>
<div><label for="photo">Photo <small>(optional)</small></label><input id="photo" type="file" accept="image/*"></div></div>
<img id="prev" class="preview hidden" alt="Photo preview">
<label for="description">Description <small>(color, brand, marks only you would know)</small></label><textarea id="description" maxlength="500"></textarea>
<h2 style="margin-top:1.4rem">The owner</h2>
<label for="owner_name">Full name</label><input id="owner_name" required maxlength="80" autocomplete="name">
<div class="grid2"><div><label for="grade_section">Grade / section</label><input id="grade_section" maxlength="40" placeholder="BSECE 2-A"></div>
<div><label for="student_no">Student number</label><input id="student_no" required maxlength="30"></div></div>
<label for="contact">Contact number <small>(only school staff can see this)</small></label><input id="contact" required maxlength="60" inputmode="tel">
<div id="m" class="msg hidden" role="alert"></div><button class="btn" id="go" style="margin-top:1rem">Submit registration</button></form>
<div id="done" class="card hidden"><h2>Registered</h2><p>Your reference code is</p><p style="font-size:2rem;font-weight:800;margin:.2rem 0" id="refc"></p>
<p>Bring the item and your school ID to the staff office to get your QR tag. Keep this code and your student number to check your item later.</p><a class="btn alt" href="/register">Register another item</a></div></main>
<script src="/app.js"></script><script>header();
let photo=null;
$('#photo').onchange=async e=>{photo=null;$('#prev').classList.add('hidden');const f=e.target.files[0];if(!f)return;try{photo=await resizePhoto(f);$('#prev').src=photo;$('#prev').classList.remove('hidden')}catch(x){show($('#m'),x.message,'err')}};
$('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;show($('#m'),'','err');
 try{const d={photo};for(const k of ['item_name','category','description','owner_name','grade_section','student_no','contact'])d[k]=$('#'+k).value;
  const r=await api('/api/register',d);$('#refc').textContent=r.ref;$('#f').classList.add('hidden');$('#done').classList.remove('hidden');scrollTo(0,0)}
 catch(x){show($('#m'),x.message,'err')}b.disabled=false};</script></body></html>
